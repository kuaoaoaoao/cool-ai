services:
  yudao-ai-worker:
    build: .
    container_name: yudao-ai-worker
    ports:
      - "8099:8099"
    command:
      - python
      - /app/worker.py
      - --host
      - 0.0.0.0
      - --port
      - "8099"
      - --token
      - worker-secret
      - --public-base-url
      - http://127.0.0.1:8099
    restart: unless-stopped
